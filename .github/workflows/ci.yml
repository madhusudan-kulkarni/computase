name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Verify lockfile
        run: uv lock --check
      - name: Install project
        run: uv sync --locked --extra dev
      - name: Check formatting
        run: uv run --locked ruff format --check src tests evaluations scripts skills/computase/scripts
      - name: Lint
        run: uv run --locked ruff check src tests evaluations scripts skills/computase/scripts
      - name: Type-check
        run: uv run --locked mypy src tests evaluations scripts skills/computase/scripts

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install project
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}
      - name: Run tests
        run: uv run --locked --python ${{ matrix.python-version }} pytest -q
      - name: Run executable evaluations
        run: uv run --locked --python ${{ matrix.python-version }} python -m evaluations.runner
